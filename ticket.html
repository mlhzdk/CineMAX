<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets - CineMAX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f8f8f8;
            color: #333;
            line-height: 1.6;
        }
        
        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .logo span {
            color: #f5c518;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .ticket-form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        .btn {
            display: inline-block;
            background: #f5c518;
            color: #222;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #e0b416;
        }
        
        .btn-block {
            display: block;
            width: 100%;
        }
        
        .movie-info {
            display: flex;
            margin-bottom: 30px;
            align-items: center;
        }
        
        .movie-poster {
            width: 150px;
            height: 225px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 20px;
        }
        
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Cine<span>MAX</span></div>
    </header>
    
    <div class="container">
        <div class="ticket-form">
            <h1>Book Your Tickets</h1>
            
            <div class="movie-info">
                <img id="movie-poster" src="placeholder.jpg" alt="Movie Poster" class="movie-poster">
                <div>
                    <h2 id="movie-title">Movie Title</h2>
                    <p id="movie-rating">Rating: PG-13</p>
                    <p id="movie-duration">Duration: 2h 15m</p>
                </div>
            </div>
            
            <form action="thankyou.html" method="GET">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                
                <div class="form-group">
                    <label for="time">Time</label>
                    <select id="time" name="time" required>
                        <option value="">Select a time</option>
                        <option value="10:00 AM">10:00 AM</option>
                        <option value="1:00 PM">1:00 PM</option>
                        <option value="4:00 PM">4:00 PM</option>
                        <option value="7:00 PM">7:00 PM</option>
                        <option value="10:00 PM">10:00 PM</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="seats">Number of Seats</label>
                    <input type="number" id="seats" name="seats" min="1" max="10" required>
                </div>
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <input type="hidden" id="hidden-movie" name="movie">
                <input type="hidden" id="hidden-rating" name="rating">
                <input type="hidden" id="hidden-duration" name="duration">
                
                <button type="submit" class="btn btn-block">Complete Booking</button>
            </form>
        </div>
    </div>

    <script>
        // Get movie details from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const movie = urlParams.get('movie');
        const rating = urlParams.get('rating');
        const duration = urlParams.get('duration');
        const poster = urlParams.get('poster');

        // Set movie details on page
        if (movie) {
            document.getElementById('movie-title').textContent = movie;
            document.getElementById('hidden-movie').value = movie;
        }
        if (rating) {
            document.getElementById('movie-rating').textContent = `Rating: ${rating}`;
            document.getElementById('hidden-rating').value = rating;
        }
        if (duration) {
            document.getElementById('movie-duration').textContent = `Duration: ${duration}`;
            document.getElementById('hidden-duration').value = duration;
        }
        if (poster) {
            document.getElementById('movie-poster').src = poster;
            document.getElementById('movie-poster').alt = movie;
        }
    </script>
    
    <footer>
        <p>&copy; 2023 CineMAX. All Rights Reserved.</p>
    </footer>
</body>
</html>
