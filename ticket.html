<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Tickets - CineMAX</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #f8f8f8;
            color: #333;
            line-height: 1.6;
        }
        
        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        
        .logo {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .logo span {
            color: #f5c518;
        }
        
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        .ticket-form {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        .btn {
            display: inline-block;
            background: #f5c518;
            color: #222;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #e0b416;
        }
        
        .btn-block {
            display: block;
            width: 100%;
        }
        
        .movie-info {
            display: flex;
            margin-bottom: 30px;
            align-items: center;
        }
        
        .movie-poster {
            width: 150px;
            height: 225px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 20px;
        }
        
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Cine<span>MAX</span></div>
    </header>
    
    <div class="container">
        <div class="ticket-form">
            <h1>Book Your Tickets</h1>
            
            <div class="movie-info">
                <img src="movie-poster.jpg" alt="Movie Poster" class="movie-poster">
                <div>
                    <h2>Movie Title</h2>
                    <p>Rating: PG-13</p>
                    <p>Duration: 2h 15m</p>
                </div>
            </div>
            
            <form>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                
                <div class="form-group">
                    <label for="time">Time</label>
                    <select id="time" required>
                        <option value="">Select a time</option>
                        <option value="10:00">10:00 AM</option>
                        <option value="13:00">1:00 PM</option>
                        <option value="16:00">4:00 PM</option>
                        <option value="19:00">7:00 PM</option>
                        <option value="22:00">10:00 PM</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="seats">Number of Seats</label>
                    <input type="number" id="seats" min="1" max="10" required>
                </div>
                
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>
                
                <button type="submit" class="btn btn-block">Complete Booking</button>
            </form>
        </div>
    </div>
    
    <footer>
        <p>&copy; 2023 CineMAX. All Rights Reserved.</p>
    </footer>
</body>
</html>
